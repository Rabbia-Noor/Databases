name: Verify simple Python database lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python drivers on the host
        run: python -m pip install -r requirements.txt
      - name: Validate database-only Compose configuration
        run: docker compose config --quiet
      - name: Start and wait for the four databases
        run: docker compose up -d --wait --wait-timeout 240 mysql mongo-dev mongo-test mongo-prod
      - name: Verify the four short examples and all environment selections
        run: python tests/verify_connections.py
      - name: Show service logs if verification failed
        if: failure()
        run: docker compose logs --no-color
      - name: Remove disposable services and volumes
        if: always()
        run: docker compose down -v
