name: Verify Docker database lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Match bind-mount ownership to the runner
        run: |
          echo "LAB_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LAB_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Validate Compose and build the Python image
        run: |
          docker compose config --quiet
          docker compose build app
      - name: Run offline configuration and database-boundary tests
        run: docker compose run --rm app python -m unittest discover -s tests -v
      - name: Start and wait for the four databases
        run: docker compose up -d --wait --wait-timeout 240 mysql mongo-dev mongo-test mongo-prod
      - name: Prepare local dummy credential files
        run: docker compose run --rm app python prepare_config.py
      - name: Run all 11 live database scenarios
        run: docker compose run --rm app python smoke_test.py
      - name: Show service logs if verification failed
        if: failure()
        run: docker compose logs --no-color
      - name: Remove disposable services and volumes
        if: always()
        run: docker compose down -v
